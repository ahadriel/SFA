name: Build Hybrid OS CLI ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "iso/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"
      - "docs/**"

permissions:
  contents: write

# A newer source push supersedes an older ISO build. Avoid publishing stale images.
concurrency:
  group: hybrid-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kernel ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-common grub-pc-bin xorriso mtools qemu-system-x86

      - name: Build standalone Hybrid kernel ISO
        run: bash scripts/build-iso.sh

      - name: Verify ISO
        run: |
          test -s isobuilds/hybrid-os-cli.iso
          file isobuilds/hybrid-os-cli.iso
          ls -lh isobuilds/hybrid-os-cli.iso

      - name: QEMU boot smoke test
        shell: bash
        run: |
          set +e
          timeout 10s qemu-system-i386 -machine pc -m 128M -cdrom isobuilds/hybrid-os-cli.iso -boot d -serial stdio -monitor none -display none -no-reboot -no-shutdown > build/qemu-serial.log 2>&1
          qemu_status=$?
          set -e
          cat build/qemu-serial.log
          if [[ $qemu_status -ne 124 && $qemu_status -ne 0 ]]; then
            echo "QEMU exited unexpectedly with status $qemu_status"
            exit 1
          fi
          grep -q "HYBRID: kernel initialised" build/qemu-serial.log

      - name: Save ISO into the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another workflow run may have pushed while this build was running.
          # Rebase the generated-artifact commit onto the latest main without
          # carrying an outdated source checkout into the new commit.
          git fetch origin main
          git reset --soft origin/main
          git add -f isobuilds/hybrid-os-cli.iso

          if git diff --cached --quiet; then
            echo "The generated ISO is unchanged; no repository commit is needed."
          else
            git commit -m "Update built Hybrid OS ISO"
            git push origin HEAD:main
          fi

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-os-cli-bios
          path: isobuilds/hybrid-os-cli.iso
          if-no-files-found: error
          retention-days: 14
