name: Build Hybrid OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify build files
        run: |
          pwd
          ls -la
          test -f scripts/build-iso.sh
          test -f config/includes.chroot/usr/local/sbin/hybrid

      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools

      - name: Build ISO
        run: sudo bash scripts/build-iso.sh

      - name: Find generated ISO
        id: iso
        shell: bash
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -print -quit)"
          if [[ -z "$ISO" ]]; then
            echo "No ISO was produced by live-build."
            exit 1
          fi
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          ls -lh "$ISO"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-os-uefi-amd64
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 14
