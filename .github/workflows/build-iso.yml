name: Build Hybrid OS CLI ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - "iso/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kernel ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib grub-common grub-pc-bin xorriso

      - name: Build standalone Hybrid kernel ISO
        run: bash scripts/build-iso.sh

      - name: Verify ISO
        run: |
          test -s hybrid-os-cli.iso
          file hybrid-os-cli.iso
          ls -lh hybrid-os-cli.iso

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-os-cli-bios
          path: hybrid-os-cli.iso
          if-no-files-found: error
          retention-days: 14
