name: Build Hybrid Desktop ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/build-desktop-iso.sh"
      - ".github/workflows/build-desktop-iso.yml"
      - "docs/DESKTOP.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: hybrid-desktop-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build amd64 desktop live ISO
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install live image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools

      - name: Validate desktop manager Python syntax
        run: python3 -m py_compile config/includes.chroot/usr/local/bin/hybrid-control-center

      - name: Build Hybrid Desktop
        run: sudo bash scripts/build-desktop-iso.sh

      - name: Verify ISO and boot metadata
        run: |
          test -s isobuilds/hybrid-desktop-amd64.iso
          file isobuilds/hybrid-desktop-amd64.iso
          ls -lh isobuilds/hybrid-desktop-amd64.iso
          xorriso -indev isobuilds/hybrid-desktop-amd64.iso -report_el_torito plain

      - name: Upload Hybrid Desktop ISO
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-desktop-amd64
          path: isobuilds/hybrid-desktop-amd64.iso
          if-no-files-found: error
          retention-days: 14
